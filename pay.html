<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pay Your JGA Invoice</title>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container" style="max-width: 720px; padding-top: 96px; padding-bottom: 96px;">
    <div class="section-label">Jay's Graphic Arts</div>
    <h1 class="page-hero-title">Secure project payment.</h1>
    <p class="page-hero-subtitle">Choose the payment requested in your quote. Card details are entered only on Stripe's hosted checkout page.</p>
    <div id="message" role="status" style="margin: 32px 0; color: var(--color-muted);">Preparing payment options…</div>
    <div style="display: flex; gap: 16px; flex-wrap: wrap;">
      <button class="btn btn-primary" data-payment="deposit" type="button">Pay deposit</button>
      <button class="btn btn-outline" data-payment="balance" type="button">Pay balance</button>
    </div>
    <p style="margin-top: 32px; color: var(--color-muted); font-size: 0.875rem;">
      Your payment link is tied to the project reference in this page's URL. Do not share it publicly.
    </p>
  </main>
  <script>
    (() => {
      const endpoint = 'https://jtjgqbwlduwzbeqicstx.supabase.co/functions/v1/brick1-checkout';
      const orderId = new URLSearchParams(window.location.search).get('orderId');
      const message = document.getElementById('message');
      const buttons = [...document.querySelectorAll('[data-payment]')];
      if (!orderId) {
        message.textContent = 'Missing project reference. Please use the payment link from your quote.';
        buttons.forEach((button) => { button.disabled = true; });
        return;
      }
      message.textContent = 'Select the payment requested in your quote.';
      buttons.forEach((button) => {
        button.addEventListener('click', async () => {
          buttons.forEach((item) => { item.disabled = true; });
          message.textContent = 'Opening secure Stripe checkout…';
          try {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ orderId, paymentType: button.dataset.payment }),
            });
            const result = await response.json();
            if (!response.ok || !result.checkoutUrl) throw new Error(result.error || 'checkout_failed');
            window.location.assign(result.checkoutUrl);
          } catch (error) {
            message.textContent = 'Payment could not be started. Please contact hello@jays-graphic-arts.ai and include your project reference.';
            buttons.forEach((item) => { item.disabled = false; });
          }
        });
      });
    })();
  </script>
</body>
</html>
