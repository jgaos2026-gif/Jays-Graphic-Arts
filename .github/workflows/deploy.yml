name: Deploy site

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy.yml"
      - "*.html"
      - "favicon.svg"
      - "robots.txt"
      - "sitemap.xml"
      - "css/**"
      - "js/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp ./*.html _site/
          cp robots.txt _site/
          cp sitemap.xml _site/
          cp favicon.svg _site/
          cp -R css _site/
          cp -R js _site/
          cp -R docs _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
