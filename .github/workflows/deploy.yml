name: Deploy site

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy.yml"
      - "index.html"
      - "services.html"
      - "portfolio.html"
      - "contact.html"
      - "css/**"
      - "js/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp index.html services.html portfolio.html contact.html _site/
          cp -R css js docs _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
